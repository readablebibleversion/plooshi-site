# Publishes ./site to GitHub Pages. Runs only when started by hand:
# repo Actions tab → "Deploy to GitHub Pages" → Run workflow.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions"
# (private repos need GitHub Pro/Team for Pages).
# To deploy on every push instead, add under `on:`
#   push:
#     branches: [main]
name: Deploy to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
